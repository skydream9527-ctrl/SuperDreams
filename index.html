<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperDreams 📱 — 桌面 Widget & 待办流 App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .phone-frame {
      width: 375px;
      height: 720px;
      background: #0f172a;
      border: 12px solid #1e293b;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .phone-notch {
      width: 140px; height: 24px;
      background: #1e293b;
      border-radius: 0 0 16px 16px;
      margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }
    .notch-camera { width: 8px; height: 8px; background: #090d16; border-radius: 50%; }
    .notch-speaker { width: 40px; height: 4px; background: #090d16; border-radius: 2px; }
    
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 20px; font-size: 11px; color: #94a3b8; font-weight: 600;
    }
    .app-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 18px; font-weight: 800; color: #818cf8;
      display: flex; align-items: center; justify-content: space-between;
    }
    .app-body {
      flex: 1; padding: 20px; overflow-y: auto; text-align: center;
    }
    
    .action-btn {
      background: #818cf8; color: #0f172a; border: none; font-weight: 800;
      padding: 12px 20px; border-radius: 12px; cursor: pointer; font-size: 14px;
      width: 100%; transition: all 0.2s ease;
    }
    .action-btn:hover { opacity: 0.9; transform: scale(0.98); }
    .home-bar { width: 120px; height: 4px; background: rgba(255, 255, 255, 0.3); border-radius: 2px; margin: 12px auto; }

    .todo-card {
      background: #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
      border: 1px solid rgba(255,255,255,0.06); cursor: pointer; user-select: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .todo-card:hover { transform: translateX(4px); border-color: #818cf8; }
    .todo-card.completed { opacity: 0.6; text-decoration: line-through; }
  </style>
</head>
<body>

  <div class="phone-frame">
    <div class="phone-notch">
      <div class="notch-camera"></div>
      <div class="notch-speaker"></div>
    </div>
    <div class="status-bar">
      <span>14:20</span>
      <span>📶 5G  🔋 100%</span>
    </div>
    <div class="app-header">
      <span>SuperDreams 桌面助手</span>
      <span style="font-size:12px; opacity:0.7;">Android H5 Demo</span>
    </div>
    <div class="app-body">
      <div style="background:rgba(129, 140, 248, 0.12); border:1px solid rgba(129, 140, 248, 0.3); padding:16px; border-radius:16px; margin-bottom:16px; text-align:left;">
        <div style="font-size:11px; color:#818cf8; font-weight:700; letter-spacing:1px;">WIDGET 插件 & 缓存持久化</div>
        <div style="font-size:18px; font-weight:800; margin:6px 0;">今日焦点 & 待办清单</div>
        <div style="font-size:12px; color:#94a3b8;">提示: 点击任务可切换完成状态，长按删除</div>
      </div>

      <div id="todoList" style="text-align:left;"></div>

      <button class="action-btn" onclick="promptAddTodo()" style="margin-top:16px;">＋ 添加自定义待办事项</button>
    </div>
    <div class="home-bar"></div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('superdreams_todos') || 'null') || [
      { id: 1, title: '✅ 完成 Android Widget 适配', done: true },
      { id: 2, title: '📰 阅读 AI 行业最新论文动态', done: false },
      { id: 3, title: '🚀 优化多 Agent 协作工作流', done: false }
    ];

    function saveAndRender() {
      localStorage.setItem('superdreams_todos', JSON.stringify(todos));
      const box = document.getElementById('todoList');
      box.innerHTML = todos.map(t => `
        <div class="todo-card ${t.done ? 'completed' : ''}" onclick="toggleTodo(${t.id})" oncontextmenu="deleteTodo(event, ${t.id})">
          <span style="font-size:13px; font-weight:600;">${t.title}</span>
          <span style="font-size:11px; color:${t.done ? '#10b981' : '#f59e0b'}; font-weight:700;">${t.done ? '已完成' : '进行中'}</span>
        </div>
      `).join('');
    }

    function toggleTodo(id) {
      const item = todos.find(t => t.id === id);
      if (item) { item.done = !item.done; saveAndRender(); }
    }

    function deleteTodo(e, id) {
      e.preventDefault();
      if (confirm('是否删除此项待办？')) {
        todos = todos.filter(t => t.id !== id);
        saveAndRender();
      }
    }

    function promptAddTodo() {
      const text = prompt('请输入新待办事项内容:');
      if (text && text.trim()) {
        todos.push({ id: Date.now(), title: '📌 ' + text.trim(), done: false });
        saveAndRender();
      }
    }

    saveAndRender();
  </script>
</body>
</html>
